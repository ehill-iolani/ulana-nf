name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java (required by Nextflow)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-stable"

      # -stub-run: only SPECIES_TREE has a stub (the synthetic genomes have no
      # marker genes, so GToTree can't build a real tree from them); it writes
      # a star tree over the real neighbours instead. Every other step runs for
      # real. Run -profile test without -stub-run locally to exercise GToTree
      - name: Run pipeline against the synthetic test dataset
        run: nextflow run main.nf -profile test,docker -stub-run
